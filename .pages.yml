# Pages CMS (https://app.pagescms.org/) reads this file from the repository root.
# No subscription or custom backend required. Entries update JSON files directly.
media:
  - name: images
    label: Site images
    input: media/images
    output: /media/images
    extensions: [jpg, jpeg, png, webp, svg]
    rename: safe
  - name: docs
    label: Public documents (review before uploading)
    input: media/docs
    output: /media/docs
    extensions: [pdf]
    rename: safe
content:
  - name: profile
    label: 01 · Profile & design
    type: file
    path: content/profile.json
    format: json
    fields:
      - {name: name, label: Name, type: string}
      - {name: professional_title, label: Professional title, type: string}
      - {name: postgraduate_label, label: Researcher title, type: string}
      - {name: location, label: Location, type: string}
      - {name: introduction, label: Intro paragraph, type: text}
      - name: focus
        label: Fields of expertise in introduction
        type: string
        list: true
      - name: resume_url
        label: Upload / replace public CV (PDF)
        type: file
        options:
          media: docs
          extensions: [pdf]
      - {name: show_cv, label: Show CV download link on site, type: boolean}
      - {name: showcase_autoplay, label: Auto-advance projects in homepage slideshow, type: boolean}
      - {name: email, label: Public contact email, type: string}
      - {name: research_statement, label: Research introduction, type: text}
      - {name: research_note, label: Research explanatory note, type: text}
      - name: research_areas
        label: Research focus cards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - {name: title, label: Title, type: string}
          - {name: description, label: Description, type: text}
      - {name: about, label: About paragraph, type: text}
      - name: about_points
        label: Short biography statements
        type: string
        list: true
      - name: links
        label: Public profiles
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - {name: label, type: string}
          - {name: url, type: string}
      - name: skills
        label: Skills groups
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{group}"
        fields:
          - {name: group, label: Heading, type: string}
          - {name: items, label: Skills text, type: text}

  - name: publications
    label: 02 · Publications
    type: file
    path: content/publications.json
    format: json
    list: true
    fields:
      - {name: title, label: English title (translated where necessary), type: string, required: true}
      - {name: authors, label: Authors, type: string}
      - {name: venue, label: Journal / conference and pages, type: string}
      - {name: year, label: Year, type: string}
      - {name: type, label: Kind, type: select, options: {values: [Journal, Conference, Preprint]}}
      - {name: status, label: Publication status (verify), type: string}
      - {name: description, label: Note / translation note, type: text}
      - {name: url, label: DOI / official PDF / publication link, type: string}
      - name: cover_image
        label: Optional article cover image
        type: image
        options:
          media: images
      - {name: show_media, label: Show cover in homepage slideshow, type: boolean}
      - {name: visible, label: Show on public site, type: boolean}

  - name: projects
    label: 03 · Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - {name: slug, label: Unique URL slug (a-z, 0-9 and -), type: string, required: true, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
      - {name: title, label: Project title, type: string, required: true}
      - {name: kind, label: Category, type: select, options: {values: [Academic, Professional]}}
      - {name: discipline, label: Engineering discipline, type: string}
      - {name: year, label: Year, type: string}
      - {name: summary, label: Short project summary, type: text}
      - {name: role, label: Your own contribution, type: string}
      - {name: methods, label: Methods / software, type: string}
      - {name: challenge, label: Context & challenge, type: text}
      - {name: approach, label: Approach & methods, type: text}
      - {name: outcome, label: Outcomes (only verifiable facts), type: text}
      - name: cover_image
        label: Cover image (upload via CMS)
        type: image
        options:
          media: images
      - {name: image_alt, label: Accessible image description, type: string}
      - name: documents
        label: Public documents (only if permitted)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - {name: label, label: Button label, type: string}
          - name: url
            label: Upload / choose PDF directly (or paste URL)
            type: file
            options:
              media: docs
              extensions: [pdf]
      - name: gallery
        label: Image gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: url
            type: image
            options:
              media: images
          - {name: caption, type: string}
      - {name: featured, label: Featured (reserved for later), type: boolean}
      - {name: visible, label: Show on public site, type: boolean}
      - {name: show_media, label: Show images and PDF documents on site, type: boolean}

  - name: education
    label: 04 · Education
    type: file
    path: content/education.json
    format: json
    list: true
    fields:
      - {name: period, label: Period, type: string}
      - {name: qualification, label: Qualification, type: string}
      - {name: institution, label: University / institution, type: string}
      - {name: details, label: Details, type: text}
      - {name: marker, label: Badge (optional), type: string}
      - name: subjects
        label: Selected subjects / research areas
        type: string
        list: true
      - name: competencies
        label: Competencies
        type: string
        list: true
      - name: diploma_url
        label: Upload diploma for expanded panel
        type: file
        options:
          media: docs
          extensions: [pdf]
      - {name: show_diploma, label: Show diploma preview to visitors, type: boolean}
      - {name: url, label: Public document URL (optional), type: string}
      - {name: visible, label: Show on public site, type: boolean}

  - name: software
    label: 05 · Software and evidence
    type: file
    path: content/software.json
    format: json
    list: true
    fields:
      - {name: name, label: Software or method, type: string, required: true}
      - {name: category, label: Category, type: string}
      - {name: description, label: Brief description, type: text}
      - {name: methods, label: Technical experience, type: text}
      - name: gallery
        label: Model / drawing screenshots
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
          - {name: caption, label: Caption, type: string}
      - name: documents
        label: Calculation documents
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - {name: label, label: Document title, type: string}
          - name: url
            label: Upload PDF
            type: file
            options:
              media: docs
              extensions: [pdf]
      - {name: show_media, label: Show uploaded materials, type: boolean}
      - {name: visible, label: Display on website, type: boolean}

  - name: additional
    label: 06 · Additional information
    type: file
    path: content/additional.json
    format: json
    list: true
    fields:
      - {name: title, label: Heading, type: string, required: true}
      - {name: description, label: Short description, type: text}
      - {name: url, label: Optional public link, type: string}
      - {name: visible, label: Display on website, type: boolean}
